<form
  id="kes-contact-form"
  class="contact-form"
>

  <div class="form-row form-row-two">

    <div class="form-field">

      <label for="contact-name">
        Name
      </label>

      <input
        id="contact-name"
        name="name"
        type="text"
        autocomplete="name"
        required
      >

    </div>


    <div class="form-field">

      <label for="contact-email">
        Email
      </label>

      <input
        id="contact-email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

    </div>

  </div>


  <div class="form-row form-row-two">

    <div class="form-field">

      <label for="contact-phone">
        Phone
        <span class="optional">
          Optional
        </span>
      </label>

      <input
        id="contact-phone"
        name="phone"
        type="tel"
        autocomplete="tel"
      >

    </div>


    <div class="form-field">

      <label for="contact-farm">
        Farm / Location
        <span class="optional">
          Optional
        </span>
      </label>

      <input
        id="contact-farm"
        name="farm"
        type="text"
      >

    </div>

  </div>


  <div class="form-field">

    <label for="contact-project">
      What are you working on?
    </label>

    <textarea
      id="contact-project"
      name="project"
      rows="4"
      required
    ></textarea>

  </div>


  <button
    class="button primary-button form-submit"
    type="submit"
  >
    Start the Conversation
  </button>


  <p class="form-note">
    Submitting this form will open your email program with your
    information ready to send to KES.
  </p>

</form>
